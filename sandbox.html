<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ... existing code ... -->
    <title>Studio Provenance | Professional Creator Suite</title>
    <!-- ... existing code ... -->
    <style>
        /* ... existing code ... */
        /* New Creative Ribbon Features */
        .creative-panel { display: none; padding: 15px; border-top: 1px solid var(--border-color); }
        .creative-tool { display: flex; flex-direction: column; gap: 5px; }
        .metronome-visualizer { height: 20px; background: #eee; border-radius: 4px; overflow: hidden; }
        .bpm-track { height: 100%; background: var(--brand-accent); width: 0%; transition: width 0.1s; }
    </style>
</head>
<body>

<!-- ... existing code ... -->
<div class="tabs">
    <div class="tab" onclick="setView('file')">File</div>
    <div class="tab active" id="tab-home" onclick="setView('home')">Home</div>
    <div class="tab" id="tab-creative" onclick="setView('creative')">Media & Scene</div>
    <div class="tab" id="tab-data" onclick="setView('data')" style="background:#00b894; color:white">Forensics</div>
</div>

<!-- Ribbon: Media & Scene (New Feature Set) -->
<div class="ribbon-content" id="creative-ribbon">
    <div class="group">
        <div class="btn-row">
            <button class="btn-ribbon btn-big" onclick="insertTemplate('scene')"><span>🎬</span>Scene</button>
            <button class="btn-ribbon btn-big" onclick="insertTemplate('character')"><span>👤</span>Char</button>
            <button class="btn-ribbon btn-big" onclick="insertTemplate('verse')"><span>🎵</span>Verse</button>
        </div>
        <div class="group-label">Scripts & Lyrics</div>
    </div>
    <div class="group">
        <input type="number" id="bpm-input" placeholder="BPM" style="width: 60px; padding: 4px; border: 1px solid #ccc; border-radius: 4px;">
        <div class="metronome-visualizer" style="width: 100px; margin-top: 5px;">
            <div id="bpm-bar" class="bpm-track"></div>
        </div>
        <div class="group-label">Tempo/BPM</div>
    </div>
</div>

<!-- ... existing code ... -->

<script>
    // New Feature: Template Insertion for Screenwriters/Musicians
    function insertTemplate(type) {
        const templates = {
            scene: "\n\n[SCENE START]\nEXT. LOCATION - DAY\nDESCRIPTION OF ACTION.\n\nCHARACTER: Dialogue goes here.\n[SCENE END]\n",
            character: "\n\n--- CHARACTER PROFILE ---\nNAME: \nROLE: \nCORE MOTIVATION: \n-------------------------\n",
            verse: "\n\n[VERSE 1]\nLine 1\nLine 2\nLine 3\nLine 4\n[CHORUS]\n"
        };
        insertTextAtCursor(templates[type]);
    }

    function insertTextAtCursor(text) {
        editor.focus();
        const sel = window.getSelection();
        if (sel.rangeCount) {
            const range = sel.getRangeAt(0);
            range.deleteContents();
            const node = document.createTextNode(text);
            range.insertNode(node);
            range.setStartAfter(node);
            sel.removeAllRanges();
            sel.addRange(range);
        }
    }

    // New Feature: Simple BPM Visualizer
    setInterval(() => {
        const bpm = document.getElementById('bpm-input').value || 120;
        const bar = document.getElementById('bpm-bar');
        const progress = (Date.now() % (60000 / bpm)) / (60000 / bpm) * 100;
        bar.style.width = progress + "%";
    }, 50);

    // Existing functions...
    // ... existing code ...
</script>
</body>
</html>
