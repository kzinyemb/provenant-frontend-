<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Provenant™</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap">
    <style>
        :root { 
            --brand-accent: #00b894; 
            --brand-dark: #0f172a; 
            --brand-writer: #3b82f6; 
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: #0f172a; 
            color: white; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        .checkout-container { 
            display: grid; 
            grid-template-columns: 1.5fr 1fr; 
            width: 100%; 
            max-width: 1000px; 
            background: #1e293b; 
            border-radius: 24px; 
            overflow: hidden; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .payment-form { padding: 50px; }
        .order-summary { 
            padding: 50px; 
            background: rgba(255, 255, 255, 0.02); 
            border-left: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .secure-btn { 
            width: 100%; 
            background: var(--brand-writer); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .secure-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

        h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; }
        h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; color: #fff; }

        input { 
            width: 100%; 
            padding: 14px; 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 8px; 
            color: white; 
            margin-bottom: 15px; 
            outline: none;
            font-size: 14px;
        }
        input:focus { border-color: var(--brand-writer); }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 15px;
            color: var(--text-muted);
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .total {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        .legal-check {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .legal-check input { width: auto; margin-bottom: 0; margin-top: 3px; }

        @media (max-width: 850px) { 
            .checkout-container { grid-template-columns: 1fr; } 
            .order-summary { border-left: none; border-top: 1px solid rgba(255,255,255,0.05); }
        }
    </style>
</head>
<body>

    <div style="margin-bottom: 25px;">
        <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600;">← Back to Main Hub</a>
    </div>

    <div class="checkout-container" id="container">
        <!-- Main Form -->
        <div class="payment-form" id="payment-form-pane">
            <h2>Complete Editorial Enterprise Setup</h2>
            <form id="pay-form">
                <input type="email" placeholder="Manager Email Address" required>
                <input type="text" placeholder="Manager Full Name" required>
                
                <label class="legal-check">
                    <input type="checkbox" required>
                    <span>I agree to the <a href="/terms.html" style="color: var(--brand-writer);" target="_blank">Terms of Service</a> and <a href="/privacy.html" style="color: var(--brand-writer);" target="_blank">Privacy Policy</a>.</span>
                </label>

                <button type="submit" class="secure-btn">Proceed to Payment</button>
            </form>
        </div>

        <!-- Summary -->
        <div class="order-summary" id="summary-pane">
            <div>
                <h3>Order Summary</h3>
                <div id="summary-content">Loading...</div>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 30px;">
                🔒 Encrypted 256-Bit SSL Connection
            </div>
        </div>
    </div>

    <script>
        const stripeLinks = {
            "Writers Tier": "https://buy.stripe.com/test_dRm14o03s81ocilcxjbo402",
            "Editorial Enterprise Suite": "https://buy.stripe.com/test_14AaEY17w3L8dmpcxjbo401",
            "Academic Suite": "https://buy.stripe.com/test_bJe8wQ17w81o2HL54Rbo403",
            "Creator Studio Pro Suite": "https://buy.stripe.com/test_dRm14o03s81ocilcxjbo402"
        };

        const planPrices = {
            "Writers Tier": "$14.99/mo",
            "Editorial Enterprise Suite": "$89.00/mo",
            "Academic Suite": "$12.99/prof/mo",
            "Creator Studio Pro Suite": "$29.00/mo"
        };

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const rawPlan = params.get('plan') || "Editorial Enterprise Suite";
            const plan = decodeURIComponent(rawPlan);
            const displayPrice = planPrices[plan] || "$89.00/mo";
            
            document.getElementById('summary-content').innerHTML = `
                <div class="summary-item">
                    <div style="font-weight: 700; color: #fff;">${plan}</div>
                    <div>30-Day Trial</div>
                </div>
                <div class="summary-item">
                    <div>Renews At</div>
                    <div>${displayPrice}</div>
                </div>
                <div class="total">
                    <span>Due Today</span>
                    <span style="color: var(--brand-accent);">$0.00</span>
                </div>
            `;
        };

        document.getElementById('pay-form').onsubmit = (e) => {
            e.preventDefault();
            const params = new URLSearchParams(window.location.search);
            const rawPlan = params.get('plan') || "Editorial Enterprise Suite";
            const plan = decodeURIComponent(rawPlan);

            const emailInput = e.target.querySelector('input[type="email"]').value;
            let targetUrl = stripeLinks[plan] || stripeLinks["Editorial Enterprise Suite"];
            
            // Append prefilled manager email to Stripe URL
            const separator = targetUrl.includes('?') ? '&' : '?';
            targetUrl += `${separator}prefilled_email=${encodeURIComponent(emailInput)}`;

            window.location.href = targetUrl;
        };
    </script>
</body>
</html>
