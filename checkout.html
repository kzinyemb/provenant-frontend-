<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Provenant™ Forensics</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        :root {
            --brand-accent: #00b894;
            --brand-dark: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-writer: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .checkout-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* Payment Forms */
        .payment-form { padding: 60px; background: #1e293b; }
        .payment-form h2 { margin-bottom: 30px; font-size: 1.8rem; font-weight: 900; }
        .form-group { margin-bottom: 20px; }
        <!-- SECURED INTERCEPTION MODAL GATEWAY -->
        <div id="newsroom-lock-screen" style="display: none;">
            <span style="font-size: 3rem;">🏢</span>
            <h2 style="font-weight: 900; font-size: 2rem;">Newsroom Authorization Required</h2>
            <p style="color: var(--text-muted); font-size: 14px; max-width: 480px; margin: 0 auto;">
                The Editorial Enterprise Suite is restricted to certified organizational newsrooms. Please enter your team provisioning code to clear setup security logs.
            </p>
            <input type="password" id="newsroom-passcode-input" placeholder="Enter Newsroom Passcode" style="max-width: 320px; text-align: center; margin-top: 10px;">
            <button class="secure-btn" onclick="verifyNewsroomToken()" style="max-width: 320px; margin-top: 5px; background: var(--brand-accent); color: var(--brand-dark); box-shadow: 0 4px 12px rgba(0,184,148,0.2);">Verify License Token</button>
            <a href="index.html" style="color: var(--text-muted); font-size: 12px; text-decoration: none; margin-top: 10px;">← Cancel and Return Home</a>
        </div>

        <!-- MAIN ACCOUNT INPUT LAYOUT FORM -->
        <div class="payment-form" id="main-payment-pane">
            <h2 id="checkout-title">Complete Your Sandbox Setup</h2>
            <form id="payment-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@domain.com" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="First and Last Name" required>
                </div>
                <button type="submit" class="secure-btn">Continue to Secure Setup</button>
            </form>
        </div>

        <!-- Summary -->
        <div class="order-summary" id="main-summary-pane">
            <h3>Order Summary</h3>
        // Form 2 Submit: Validates Code & Redirects to Stripe
        document.getElementById('code-verification-form').onsubmit = function(e) {
            e.preventDefault();
            const enteredCode = document.getElementById('verification-code-input').value.trim();
            const errorMsg = document.getElementById('code-error-msg');

            if (enteredCode === activeCode) {
                errorMsg.style.display = 'none';

                // IF ENTERPRISE: Trigger lock screen instead of Stripe redirect
                if (activePlanName === "Editorial Enterprise Suite") {
                    document.getElementById('main-payment-pane').style.display = 'none';
                    document.getElementById('main-summary-pane').style.display = 'none';
                    document.getElementById('newsroom-lock-screen').style.display = 'flex';
                } else {
                    // Standard redirect path
                    let targetCheckoutUrl = stripePaymentLinks[activePlanName];
                    const separator = targetCheckoutUrl.includes('?') ? '&' : '?';
                    targetCheckoutUrl += `${separator}prefilled_email=${encodeURIComponent(currentEmail)}`;
                    window.location.href = targetCheckoutUrl;
                }
            } else {
                errorMsg.style.display = 'block';
            }
        };

        document.getElementById('payment-form').onsubmit = function(e) {
            e.preventDefault();
            window.location.href = stripePaymentLinks["Writers Tier"];
        };
    </script>
</body>
</html>
