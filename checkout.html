<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Provenant™</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        :root { --brand-accent: #00b894; --brand-dark: #0f172a; --brand-writer: #3b82f6; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .checkout-container { display: grid; grid-template-columns: 1.5fr 1fr; width: 100%; max-width: 1000px; background: #1e293b; border-radius: 24px; overflow: hidden; }
        .payment-form { padding: 60px; }
        .order-summary { padding: 60px; background: rgba(255,255,255,0.02); border-left: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }
        .secure-btn { width: 100%; background: var(--brand-writer); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; }
        input { width: 100%; padding: 14px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; margin-bottom: 15px; }
        @media (max-width: 850px) { .checkout-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="checkout-container" id="container">
        <!-- Enterprise Lock -->
        <div id="enterprise-lock" class="hidden" style="grid-column: span 2; padding: 60px; text-align: center;">
            <h2 class="text-3xl font-black mb-4">Newsroom Authorization</h2>
            <input type="password" id="pass-input" placeholder="Enter License Token" class="max-w-xs text-center">
            <button onclick="checkPass()" class="secure-btn max-w-xs bg-emerald-500">Verify Token</button>
        </div>

        <!-- Main Form -->
        <div class="payment-form" id="payment-form-pane">
            <h2 class="text-2xl font-bold mb-6">Complete Your Setup</h2>
            <form id="pay-form">
                <input type="email" placeholder="Email Address" required>
                <input type="text" placeholder="Full Name" required>
                <button type="submit" class="secure-btn">Continue</button>
            </form>
        </div>

        <!-- Summary -->
        <div class="order-summary" id="summary-pane">
            <h3 class="mb-4">Order Summary</h3>
            <div id="summary-content">Loading...</div>
        </div>
    </div>

    <script>
        const stripeLinks = {
            "Writers Tier": "https://buy.stripe.com/test_dRm14o03s81ocilcxjbo402",
            "Editorial Enterprise Suite": "https://buy.stripe.com/test_14AaEY17w3L8dmpcxjbo401",
            "Academic Suite": "https://buy.stripe.com/test_bJe8wQ17w81o2HL54Rbo403"
        };

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const plan = params.get('plan') || "Writers Tier";
            
            // Populate summary
            document.getElementById('summary-content').innerHTML = `
                <div class="summary-item"><div>${plan}</div><div>Price: Covered</div></div>
                <div class="total">Due Today: $0.00</div>
            `;

            // Security Gate
            if (plan === 'Editorial Enterprise Suite') {
                document.getElementById('payment-form-pane').classList.add('hidden');
                document.getElementById('summary-pane').classList.add('hidden');
                document.getElementById('enterprise-lock').classList.remove('hidden');
            }
        };

        function checkPass() {
            if (document.getElementById('pass-input').value === "NEWSROOM2026") {
                document.getElementById('enterprise-lock').classList.add('hidden');
                document.getElementById('payment-form-pane').classList.remove('hidden');
                document.getElementById('summary-pane').classList.remove('hidden');
            } else {
                alert("Invalid Token");
            }
        }

        document.getElementById('pay-form').onsubmit = (e) => {
            e.preventDefault();
            const params = new URLSearchParams(window.location.search);
            const plan = params.get('plan') || "Writers Tier";
            window.location.href = stripeLinks[plan];
        };
    </script>
</body>
</html>
