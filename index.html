<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Provenant™ Forensics</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        :root {
            --brand-accent: #00b894;
            --brand-dark: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-writer: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .checkout-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* Payment Forms */
        .payment-form { padding: 60px; background: #1e293b; }
        .payment-form h2 { margin-bottom: 30px; font-size: 1.8rem; font-weight: 900; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        input { width: 100%; padding: 14px; background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white; font-size: 16px; outline: none; }
        .secure-btn { width: 100%; background: var(--brand-writer); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 20px; }
        
        .order-summary { padding: 60px; background: rgba(255, 255, 255, 0.02); border-left: 1px solid rgba(255, 255, 255, 0.05); }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .total { font-size: 1.5rem; font-weight: 800; color: var(--brand-accent); margin-top: 20px; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <!-- Main Form -->
        <div class="payment-form" id="main-payment-pane">
            <h2 id="checkout-title">Complete Your Sandbox Setup</h2>
            <form id="payment-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@domain.com" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="First and Last Name" required>
                </div>
                <button type="submit" class="secure-btn">Continue to Secure Setup</button>
            </form>
        </div>

        <!-- Summary -->
        <div class="order-summary" id="main-summary-pane">
            <h3>Order Summary</h3>
            <div class="summary-item">
                <div id="summary-plan-name" style="font-weight: 700;">Provenant™ Workspace</div>
                <div id="summary-base-price">$14.99</div>
            </div>
            <div class="total">Due Today: $0.00</div>
        </div>
    </div>

    <script>
        const stripePaymentLinks = {
            "Writers Tier": "https://buy.stripe.com/test_dRm14o03s81ocilcxjbo402",
            "Editorial Enterprise Suite": "https://buy.stripe.com/test_14AaEY17w3L8dmpcxjbo401",
            "Academic Suite": "https://buy.stripe.com/test_bJe8wQ17w81o2HL54Rbo403"
        };

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const planParam = urlParams.get('plan');
            
            // Redirect enterprise to landing page form
            if (planParam === 'Editorial Enterprise Suite') {
                location.href = 'index.html#enterprise-tier-zone';
                return;
            }
        };

        document.getElementById('payment-form').onsubmit = function(e) {
            e.preventDefault();
            window.location.href = stripePaymentLinks["Writers Tier"];
        };
    </script>
</body>
</html>
